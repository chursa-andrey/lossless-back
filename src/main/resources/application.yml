spring:
  config:
    import: optional:file:.env.local[.properties]
  profiles:
    default: postgres
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:512MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:520MB}

auth:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:lossless-api}
    secret: ${AUTH_JWT_SECRET}
    access-ttl-minutes: ${AUTH_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${AUTH_REFRESH_TTL_DAYS:30}
  social:
    google:
      client-ids: ${AUTH_GOOGLE_CLIENT_IDS:}
    apple:
      client-ids: ${AUTH_APPLE_CLIENT_IDS:}
    facebook:
      app-id: ${AUTH_FACEBOOK_APP_ID:}
      app-secret: ${AUTH_FACEBOOK_APP_SECRET:}

app:
  security:
    cors:
      allowed-origins: []
  storage:
    local:
      root-path: ${APP_STORAGE_LOCAL_ROOT_PATH:./storage}
  tracks:
    upload:
      max-file-size: ${APP_TRACKS_UPLOAD_MAX_FILE_SIZE:500MB}
      allowed-extensions: ${APP_TRACKS_UPLOAD_ALLOWED_EXTENSIONS:wav,flac}
      max-purchase-links: ${APP_TRACKS_UPLOAD_MAX_PURCHASE_LINKS:10}
